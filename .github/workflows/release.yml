name: Release to PyPI

# 推送 v* 标签时自动构建并发布到 PyPI（Trusted Publishing / OIDC，无需配置任何 secret）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # 允许在 GitHub 页面手动触发（用于首次发布）

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing 要求：以 OIDC 身份向 PyPI 证明本次构建来自本仓库本工作流
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
