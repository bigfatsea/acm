[project]
name = "agent-config-manager"
version = "0.2.0"
description = "The Unified, Non-Destructive Model Configuration & Snapshot Manager for AI Coding Agents."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Stanford", email = "bigfatsea@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "ruamel-yaml>=0.18",
    "tomlkit>=0.13.0",
    "typer>=0.12.0",
]

[project.scripts]
acm = "acm.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

# 分发名与 Python 包名解耦：PyPI 包叫 agent-config-manager，导入名仍是 acm
[tool.uv.build-backend]
module-name = "acm"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "e2e: End-to-end acceptance tests",
    "golden: Golden fixture round-trip and non-destructive tests",
    "fault: Fault injection and resilience tests",
]
